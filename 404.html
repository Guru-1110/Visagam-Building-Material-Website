<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Visagam Building Material</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='24' width='28' height='6' rx='1' fill='%231E3A8A'/><rect x='4' y='16' width='10' height='6' rx='1' fill='%231E3A8A'/><rect x='18' y='16' width='10' height='6' rx='1' fill='%231E3A8A'/><rect x='11' y='8' width='10' height='6' rx='1' fill='%23F59E0B'/><path d='M16 2L3 8V6L16 0L29 6V8L16 2Z' fill='%231E3A8A'/></svg>">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--gradient-dark);
            color: #fff;
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(5rem, 20vw, 10rem);
            font-weight: 700;
            line-height: 1;
            background-image: var(--gradient-accent);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-page h1 { color: #fff; font-size: 1.75rem; margin: 1rem 0 0.5rem; }
        .error-page p { color: #cbd5e1; max-width: 480px; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <main class="error-page">
        <span class="error-code">404</span>
        <h1>Page Not Found</h1>
        <p>The page you're looking for has moved or no longer exists. Let's get you back to building.</p>
        <a href="/" class="btn btn-primary">Back to Home</a>
    </main>
</body>
</html>
